# Nginx para el SPA de PrácticaPE (build de React).
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash: cacheables sin revalidar.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida la resuelve React desde index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeceras razonables para el HTML y los estáticos.
    location ~* \.(?:svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
}
